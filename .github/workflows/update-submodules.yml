name: Update Submodule

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }} # PATを指定

      - name: Update submodules to latest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git submodule status | awk '{print $2}' | while read -r sub; do
            echo "=== Processing: $sub ==="
            pushd "$sub"

            branch=$(git branch --show-current)

            if [ -z "$branch" ]; then
              echo "ERROR: $sub is in detached HEAD state"
              exit 1
            fi

            echo "Current branch: $branch"

            git fetch origin

            if ! git show-ref --verify --quiet "refs/remotes/origin/$branch"; then
              echo "ERROR: origin/$branch does not exist"
              exit 1
            fi

            git reset --hard "origin/$branch"
            git clean -fd

            echo "Updated:"
            git log -1 --oneline

            popd
          done

      - name: Check for changes, commit and push
        run: |
          # 変更（差分）があるかどうかをチェック
          git diff --quiet && git diff --staged --quiet
          if [ $? -eq 0 ]; then
            echo "変更はないから、コミット＆プッシュはスキップするで。"
          else
            echo "変更を検知したから、コミット＆プッシュを実行するで。"
            git add .
            git commit -m "chore: auto-update submodules to latest [skip ci]"
            git push
          fi
