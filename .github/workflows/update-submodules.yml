name: Update Submodule

on:
  workflow_call:
    secrets:
      GH_PAT:
        required: true

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository with submodules
        uses: actions/checkout@v5
        with:
          submodules: recursive
          token: ${{ secrets.GH_PAT }}

      - name: Update submodules to latest
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git submodule foreach --recursive '
            echo "=== Processing: $name ==="

            branch=$(git config -f "$toplevel/.gitmodules" "submodule.$name.branch" 2>/dev/null || echo "")

            if [ -z "$branch" ]; then
              branch=$(git remote show origin 2>/dev/null | grep "HEAD branch" | cut -d" " -f5)
              branch="${branch:-main}"
              echo "No branch specified in .gitmodules for $name, defaulting to: $branch"
            fi

            echo "Target branch: $branch"

            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            git reset --hard "origin/$branch"
            git clean -fd

            echo "Updated to:"
            git log -1 --oneline
          '

      - name: Check for changes, commit and push
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No changes detected. Skipping commit and push."
          else
            echo "Changes detected. Committing and pushing updates..."
            git add .
            git commit -m "chore: auto-update submodules to latest [skip ci]"
            git push
          fi
